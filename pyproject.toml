[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "aura-frame-uploader"
version = "0.1.0"
description = "Publish photos to an Aura digital picture frame from the command line."
readme = "README.md"
license = { file = "LICENSE" }
requires-python = ">=3.10"
authors = [{ name = "Louie Kotler" }]
keywords = ["aura", "auraframes", "digital-photo-frame", "photos", "publishing", "exif"]
classifiers = [
    "Environment :: Console",
    "Intended Audience :: End Users/Desktop",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Topic :: Multimedia :: Graphics",
]

dependencies = [
    "requests>=2.31",
    "boto3>=1.34",
    "Pillow>=10.0",
    "keyring>=24.0",
]

[project.optional-dependencies]
dev = ["pytest>=8", "piexif>=1.1", "responses>=0.25"]

[project.urls]
Homepage = "https://github.com/louiekotler/aura-frame-uploader"
Issues = "https://github.com/louiekotler/aura-frame-uploader/issues"

[project.scripts]
aura-upload = "aura_upload.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/aura_upload"]

[tool.pytest.ini_options]
testpaths = ["tests"]
